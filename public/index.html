<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#010719" />
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

    <title>Amazing Worship Pads Pro (AWPP)</title>
    
    <style>
      /* Instant Splash Screen Loader */
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #010719;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.4s ease-out;
      }
      .loader-logo-box {
        width: 64px;
        height: 64px;
        background-color: rgba(34, 211, 238, 0.1);
        border: 1px solid rgba(34, 211, 238, 0.3);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        animation: pulseGlow 2s infinite ease-in-out;
      }
      .loader-title {
        color: #ffffff;
        font-weight: 900;
        font-size: 16px;
        letter-spacing: -0.025em;
        margin-bottom: 4px;
      }
      .loader-subtitle {
        color: #64748b;
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.7; }
      }
    </style>
  </head>
  <body class="bg-[#010719] text-white">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Instant Splash Screen displayed before React mounts -->
      <div id="initial-loader">
        <div class="loader-logo-box">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </div>
        <div class="loader-title">Amazing Worship Pads Pro</div>
        <div class="loader-subtitle">Created by Hommer Angelo</div>
      </div>
    </div>
  </body>
</html>
